########################################
#              机场订阅
########################################

proxy-providers:
  Airport1:
    type: http
    url: 你的机场订阅地址
    interval: 86400
    path: ./proxy_provider/airport1.yaml
    health-check:
      enable: true
      url: https://www.gstatic.com/generate_204
      interval: 300

########################################
#              基础设置
########################################

mixed-port: 7890
allow-lan: true
bind-address: "*"
mode: rule
log-level: info
ipv6: true
unified-delay: true
tcp-concurrent: true
find-process-mode: strict
global-client-fingerprint: chrome
keep-alive-idle: 600
keep-alive-interval: 15
external-controller: 0.0.0.0:9090
secret: "123456"
external-controller-cors:
  allow-origins:
    - "*"
  allow-private-network: true

########################################
#              GeoData设置
########################################

geodata-mode: true
geosite-matcher: succinct
geodata-loader: memconservative
geo-auto-update: true
geo-update-interval: 72
geox-url:
  geoip: https://github.com/MetaCubeX/meta-rules-dat/releases/download/latest/geoip.dat
  geosite: https://github.com/MetaCubeX/meta-rules-dat/releases/download/latest/geosite.dat
  mmdb: https://github.com/MetaCubeX/meta-rules-dat/releases/download/latest/country.mmdb

########################################
#              DNS设置
########################################

dns:
  enable: true
  listen: 0.0.0.0:7874
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  ipv6: true
  respect-rules: true
  use-hosts: true
  prefer-h3: false
  cache-algorithm: arc

  nameserver-policy:
    "geosite:cn":
      - https://223.5.5.5/dns-query
      - https://doh.pub/dns-query

  nameserver:
    - https://cloudflare-dns.com/dns-query
    - https://dns.google/dns-query

  fallback:
    - https://cloudflare-dns.com/dns-query
    - https://dns.google/dns-query
    - https://dns.quad9.net/dns-query
    - https://security.cloudflare-dns.com/dns-query

  fake-ip-filter:
    - "*.lan"
    - "*.local"
    - "*.localhost"
    - "+.home.arpa"
    - "msftconnecttest.com"
    - "msftncsi.com"
    - "courier.push.apple.com"
    - "+.apple.com"
    - "+.microsoft.com"
    - "+.steamcontent.com"
    - "localhost.ptlogin2.qq.com"

########################################
#              流量嗅探
########################################

sniffer:
  enable: true
  parse-pure-ip: true
  force-dns-mapping: true
  override-destination: true
  sniff:
    HTTP:
      ports:
        - 80
    TLS:
      ports:
        - 443
    QUIC:
      ports:
        - 443
  skip-domain:
    - "+.lan"
    - "+.local"
    - "+.home.arpa"
    
########################################
#                 TUN设置
########################################

tun:
  # 开启TUN模式
  enable: true
  # 混合网络栈
  stack: mixed
  # 实测稳定MTU
  mtu: 1490
  # 自动管理路由
  auto-route: true
  # Linux透明代理优化
  auto-redirect: true
  # 自动检测出口
  auto-detect-interface: true
  # 严格路由
  strict-route: true
  # DNS劫持
  dns-hijack:
    - any:53

########################################
#              策略组
########################################

proxy-groups:

  - name: 🧭 Select
    type: select
    include-all: true

  - name: 📡 Auto
    type: url-test
    include-all: true
    url: https://www.gstatic.com/generate_204
    interval: 300
    tolerance: 50

  - name: 🇭🇰 HK
    type: url-test
    include-all: true
    url: https://www.gstatic.com/generate_204
    interval: 300
    tolerance: 50
    filter: "(?=.*(广港|香港|HK|Hong Kong|🇭🇰|HongKong)).*$"

  - name: 🇹🇼 TW
    type: url-test
    include-all: true
    url: https://www.gstatic.com/generate_204
    interval: 300
    tolerance: 50
    filter: "(?=.*(台湾|TW|Taiwan|🇹🇼|TaiWan)).*$"

  - name: 🇯🇵 JP
    type: url-test
    include-all: true
    url: https://www.gstatic.com/generate_204
    interval: 300
    tolerance: 50
    filter: "(?=.*(日本|JP|Japan|🇯🇵)).*$"

  - name: 🇰🇷 KR
    type: url-test
    include-all: true
    url: https://www.gstatic.com/generate_204
    interval: 300
    tolerance: 50
    filter: "(?=.*(韩国|KR|Korea|🇰🇷)).*$"

  - name: 🇸🇬 SG
    type: url-test
    include-all: true
    url: https://www.gstatic.com/generate_204
    interval: 300
    tolerance: 50
    filter: "(?=.*(新加坡|SG|Singapore|🇸🇬)).*$"

  - name: 🇺🇸 US
    type: url-test
    include-all: true
    url: https://www.gstatic.com/generate_204
    interval: 300
    tolerance: 50
    filter: "(?=.*(美国|US|USA|United States|🇺🇸)).*$"

  - name: 🌏 Other
    type: url-test
    include-all: true
    url: https://www.gstatic.com/generate_204
    interval: 300
    tolerance: 50
    filter: "(?i)^(?!.*(香港|HK|Hong Kong|台湾|TW|Taiwan|日本|JP|Japan|韩国|KR|Korea|新加坡|SG|Singapore|美国|US|USA)).*$"

  - name: 🟢 Direct
    type: select
    proxies:
      - DIRECT

  - name: 🔴 Reject
    type: select
    proxies:
      - REJECT

  - name: ⭐ Default
    type: select
    proxies:
      - 🧭 Select
      - 📡 Auto
      - 🇭🇰 HK
      - 🇹🇼 TW
      - 🇯🇵 JP
      - 🇰🇷 KR
      - 🇸🇬 SG
      - 🇺🇸 US
      - 🌏 Other
      - 🟢 Direct
      - 🔴 Reject

  - name: 🤖 AI
    type: select
    proxies:
      - ⭐ Default

  - name: 🎬 Media
    type: select
    proxies:
      - ⭐ Default

  - name: 🎵 TikTok
    type: select
    proxies:
      - ⭐ Default

  - name: 💰 Crypto
    type: select
    proxies:
      - ⭐ Default

  - name: 🎮 Game
    type: select
    proxies:
      - ⭐ Default

  - name: 🐙 GitHub
    type: select
    proxies:
      - ⭐ Default

  - name: ✈️ Telegram
    type: select
    proxies:
      - ⭐ Default

  - name: 🌐 Social
    type: select
    proxies:
      - ⭐ Default

  - name: 🔍 Google
    type: select
    proxies:
      - ⭐ Default

  - name: 🪟 Microsoft
    type: select
    proxies:
      - ⭐ Default

  - name: 🍎 Apple
    type: select
    proxies:
      - ⭐ Default

  - name: 📡 Check
    type: select
    proxies:
      - ⭐ Default

  - name: 🌍 Outside
    type: select
    proxies:
      - ⭐ Default

  - name: ❓ Unknown
    type: select
    proxies:
      - ⭐ Default

########################################
#              配置缓存
########################################
profile:
  # 保存策略组选择
  # 例如手动选择的机场节点
  store-selected: true
  # 保存Fake-IP映射
  # 重启后减少DNS重新解析
  store-fake-ip: true

########################################
#              实验功能
########################################
experimental:
  # 启用缓存数据库
  # 保存运行状态
  cache-file: /etc/openclash/cache.db

########################################
#              分流规则
########################################
# 广告拦截
- GEOSITE,category-ads-all,🚫 Block
# AI服务
# 包含 Copilot
- GEOSITE,category-ai,🤖 AI
- DOMAIN-SUFFIX,copilot.microsoft.com,🤖 AI
# 流媒体
# YouTube归这里
- GEOSITE,category-media,🎬 Media
# TikTok
- GEOSITE,tiktok,🎵 TikTok
# 数字货币
- RULE-SET,Crypto,💰 Crypto
# 游戏
# Steam下载直连
- DOMAIN-SUFFIX,steamcontent.com,DIRECT
- GEOSITE,category-game,🎮 Game
- DOMAIN-SUFFIX,wargaming.net,🎮 Game
# GitHub
- GEOSITE,github,🐙 GitHub
# Telegram
- GEOSITE,telegram,✈️ Telegram
# 社交媒体
- GEOSITE,category-social-media,🌐 Social
# Google
# YouTube已经被Media提前匹配
- GEOSITE,google,🔍 Google
# Microsoft
# Copilot不会到这里
- GEOSITE,microsoft,🪟 Microsoft
# Apple
- GEOSITE,apple,🍎 Apple
# 网络检测
- RULE-SET,Check,📡 Check
# 中国大陆
- GEOSITE,cn,🏠 Inside
- GEOIP,CN,🏠 Inside
# 最终
- MATCH,❓ Unknown
