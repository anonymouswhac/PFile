########################################
#              机场订阅信息
########################################

proxy-providers:

  机场名称-1:
    type: http
    url: "订阅地址"
    path: ./proxy_provider/Airport-1.yaml
    interval: 86400
    proxy: DIRECT
    health-check:
      enable: true
      url: https://www.gstatic.com/generate_204
      interval: 300

  机场名称-2:
    type: http
    url: "订阅地址"
    path: ./proxy_provider/Airport-2.yaml
    interval: 86400
    proxy: DIRECT
    health-check:
      enable: true
      url: https://www.gstatic.com/generate_204
      interval: 300

  机场名称-3:
    type: http
    url: "订阅地址"
    path: ./proxy_provider/Airport-3.yaml
    interval: 86400
    proxy: DIRECT
    health-check:
      enable: true
      url: https://www.gstatic.com/generate_204
      interval: 300

########################################
#               策略组
########################################

proxy-groups:

  # 默认策略
  - name: ⭐ Default
    type: select
    proxies:
      - 🏠 Direct
      - 🧭 Select
      - 📡 Auto
      - 🇭🇰 HK
      - 🇹🇼 TW
      - 🇯🇵 JP
      - 🇰🇷 KR
      - 🇸🇬 SG
      - 🇺🇸 US
      - 🌏 Other
      - ⛔ Reject

  # 手动选择
  - name: 🧭 Select
    type: select
    include-all: true

  # 自动测速
  - name: 📡 Auto
    type: url-test
    include-all: true
    url: https://www.gstatic.com/generate_204
    interval: 300

########################################
#              地区策略
########################################

  # 香港
  - name: 🇭🇰 HK
    type: url-test
    include-all: true
    filter: "(?i)(?=.*(广港|香港|HK|Hong Kong|HongKong|🇭🇰)).*$"
    url: https://www.gstatic.com/generate_204
    interval: 300

  # 台湾
  - name: 🇹🇼 TW
    type: url-test
    include-all: true
    filter: "(?i)(?=.*(台湾|TW|Taiwan|🇹🇼)).*$"
    url: https://www.gstatic.com/generate_204
    interval: 300

  # 日本
  - name: 🇯🇵 JP
    type: url-test
    include-all: true
    filter: "(?i)(?=.*(日本|JP|Japan|东京|大阪|🇯🇵)).*$"
    url: https://www.gstatic.com/generate_204
    interval: 300

  # 韩国
  - name: 🇰🇷 KR
    type: url-test
    include-all: true
    filter: "(?i)(?=.*(韩国|KR|Korea|首尔|Seoul|🇰🇷)).*$"
    url: https://www.gstatic.com/generate_204
    interval: 300

  # 新加坡
  - name: 🇸🇬 SG
    type: url-test
    include-all: true
    filter: "(?i)(?=.*(新加坡|SG|Singapore|狮城|🇸🇬)).*$"
    url: https://www.gstatic.com/generate_204
    interval: 300

  # 美国
  - name: 🇺🇸 US
    type: url-test
    include-all: true
    filter: "(?i)(?=.*(美国|US|USA|United States|America|洛杉矶|硅谷|圣何塞|西雅图|纽约|🇺🇸)).*$"
    url: https://www.gstatic.com/generate_204
    interval: 300

  # 其它地区
  - name: 🌏 Other
    type: url-test
    include-all: true
    exclude-filter: "(?i)(广港|香港|HK|Hong Kong|HongKong|🇭🇰|台湾|TW|Taiwan|🇹🇼|日本|JP|Japan|东京|大阪|🇯🇵|韩国|KR|Korea|首尔|Seoul|🇰🇷|新加坡|SG|Singapore|狮城|🇸🇬|美国|US|USA|United States|America|洛杉矶|硅谷|圣何塞|西雅图|纽约|🇺🇸)"
    url: https://www.gstatic.com/generate_204
    interval: 300

########################################
#              业务策略
########################################

  # AI
  - name: 🤖 AI
    type: select
    proxies:
      - ⭐ Default

  # 流媒体
