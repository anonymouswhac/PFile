########################################
#              机场订阅信息
########################################

proxy-providers:

  Airport-1:
    type: http
    url: "订阅地址"
    path: ./proxy_provider/Airport-1.yaml
    interval: 86400
    proxy: DIRECT
    health-check:
      enable: true
      url: https://www.gstatic.com/generate_204
      interval: 300

  Airport-2:
    type: http
    url: "订阅地址"
    path: ./proxy_provider/Airport-2.yaml
    interval: 86400
    proxy: DIRECT
    health-check:
      enable: true
      url: https://www.gstatic.com/generate_204
      interval: 300

  Airport-3:
    type: http
    url: "订阅地址"
    path: ./proxy_provider/Airport-3.yaml
    interval: 86400
    proxy: DIRECT
    health-check:
      enable: true
      url: https://www.gstatic.com/generate_204
      interval: 300

########################################
#               策略组
########################################

proxy-groups:

  # AI
  - name: AI
    type: select
    include-all: true

  # Media
  - name: Media
    type: select
    include-all: true

  # Crypto
  - name: Crypto
    type: select
    include-all: true

  # Game
  - name: Game
    type: select
    include-all: true

  # GitHub
  - name: GitHub
    type: select
    include-all: true

  # Telegram
  - name: Telegram
    type: select
    include-all: true

  # Social
  - name: Social
    type: select
    include-all: true

  # Google
  - name: Google
    type: select
    include-all: true

  # Microsoft
  - name: Microsoft
    type: select
    include-all: true

  # Apple
  - name: Apple
    type: select
    include-all: true

  # Check
  - name: Check
    type: select
    include-all: true

  # Block
  - name: Block
    type: select
    proxies:
      - REJECT

  # Inside
  - name: Inside
    type: select
    proxies:
      - DIRECT

  # Outside
  - name: Outside
    type: select
    include-all: true

  # Unknown
  - name: Unknown
    type: select
    include-all: true
