########################################
#              机场订阅信息
########################################

proxy-providers:

  机场名称-1:
    type: http
    url: "订阅地址"
    path: ./proxy_provider/Airport-1.yaml
    interval: 86400
    proxy: DIRECT
    health-check:
      enable: true
      url: https://www.gstatic.com/generate_204
      interval: 300

  机场名称-2:
    type: http
    url: "订阅地址"
    path: ./proxy_provider/Airport-2.yaml
    interval: 86400
    proxy: DIRECT
    health-check:
      enable: true
      url: https://www.gstatic.com/generate_204
      interval: 300

  机场名称-3:
    type: http
    url: "订阅地址"
    path: ./proxy_provider/Airport-3.yaml
    interval: 86400
    proxy: DIRECT
    health-check:
      enable: true
      url: https://www.gstatic.com/generate_204
      interval: 300

########################################
#              基础设置
########################################

# 混合代理端口（HTTP + SOCKS5）
mixed-port: 7890

# 允许局域网设备连接
allow-lan: true

# 监听所有网卡
bind-address: "*"

# 运行模式：规则模式
mode: rule

# 日志等级：info / warning / error / debug / silent
log-level: info

# 外部控制器（供 Zashboard、MetaCubeXD 等 Dashboard 使用）
external-controller: 0.0.0.0:9090

# Dashboard API 密码（请自行修改）
secret: "请修改为随机密码"

# 允许 Dashboard 跨域访问
external-controller-cors:
  allow-origins:
    - "*"
  allow-private-network: true

# 启用 IPv6
ipv6: true

# 统一延迟计算（新版 Mihomo 推荐）
unified-delay: true

# TCP 并发连接（提升连接建立速度）
tcp-concurrent: true

# 进程识别模式
find-process-mode: strict

# 全局 TLS Client Fingerprint
global-client-fingerprint: chrome

# TCP Keep Alive
keep-alive-idle: 600
keep-alive-interval: 15

# 使用 Geo 数据库模式
geodata-mode: true

# 自动更新 Geo 数据库
geo-auto-update: true

# Geo 数据库更新时间（小时）
geo-update-interval: 24

########################################
#               策略组
########################################

proxy-groups:

  # 默认策略
  - name: ⭐ Default
    type: select
    proxies:
      - 🏠 Direct
      - 🧭 Select
      - 📡 Auto
      - 🇭🇰 HK
      - 🇹🇼 TW
      - 🇯🇵 JP
      - 🇰🇷 KR
      - 🇸🇬 SG
      - 🇺🇸 US
      - 🌏 Other
      - ⛔ Reject

  # 手动选择
  - name: 🧭 Select
    type: select
    include-all: true

  # 自动测速
  - name: 📡 Auto
    type: url-test
    include-all: true
    url: https://www.gstatic.com/generate_204
    interval: 300

########################################
#              地区策略
########################################

  # 香港
  - name: 🇭🇰 HK
    type: url-test
    include-all: true
    filter: "(?i)(?=.*(广港|香港|HK|Hong Kong|HongKong|🇭🇰)).*$"
    url: https://www.gstatic.com/generate_204
    interval: 300

  # 台湾
  - name: 🇹🇼 TW
    type: url-test
    include-all: true
    filter: "(?i)(?=.*(台湾|TW|Taiwan|🇹🇼)).*$"
    url: https://www.gstatic.com/generate_204
    interval: 300

  # 日本
  - name: 🇯🇵 JP
    type: url-test
    include-all: true
    filter: "(?i)(?=.*(日本|JP|Japan|东京|大阪|🇯🇵)).*$"
    url: https://www.gstatic.com/generate_204
    interval: 300

  # 韩国
  - name: 🇰🇷 KR
    type: url-test
    include-all: true
    filter: "(?i)(?=.*(韩国|KR|Korea|首尔|Seoul|🇰🇷)).*$"
    url: https://www.gstatic.com/generate_204
    interval: 300

  # 新加坡
  - name: 🇸🇬 SG
    type: url-test
    include-all: true
    filter: "(?i)(?=.*(新加坡|SG|Singapore|狮城|🇸🇬)).*$"
    url: https://www.gstatic.com/generate_204
    interval: 300

  # 美国
  - name: 🇺🇸 US
    type: url-test
    include-all: true
    filter: "(?i)(?=.*(美国|US|USA|United States|America|洛杉矶|硅谷|圣何塞|西雅图|纽约|🇺🇸)).*$"
    url: https://www.gstatic.com/generate_204
    interval: 300

  # 其它地区
  - name: 🌏 Other
    type: url-test
    include-all: true
    exclude-filter: "(?i)(广港|香港|HK|Hong Kong|HongKong|🇭🇰|台湾|TW|Taiwan|🇹🇼|日本|JP|Japan|东京|大阪|🇯🇵|韩国|KR|Korea|首尔|Seoul|🇰🇷|新加坡|SG|Singapore|狮城|🇸🇬|美国|US|USA|United States|America|洛杉矶|硅谷|圣何塞|西雅图|纽约|🇺🇸)"
    url: https://www.gstatic.com/generate_204
    interval: 300

########################################
