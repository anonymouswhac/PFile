########################################
#              机场订阅
########################################

proxy-providers:
  Airport1:
    type: http
    url: 你的机场订阅地址
    interval: 86400
    path: ./proxy_provider/airport1.yaml
    health-check:
      enable: true
      url: https://www.gstatic.com/generate_204
      interval: 300

proxies:
  - {name: 🟢 Direct, type: direct}
  - {name: 🔴 Reject, type: reject}
  
########################################
#              基础设置
########################################

mixed-port: 7890
allow-lan: true
bind-address: "*"
mode: rule
log-level: info
ipv6: true
unified-delay: true
tcp-concurrent: true
find-process-mode: strict
global-client-fingerprint: chrome
keep-alive-idle: 600
keep-alive-interval: 15
external-controller: 0.0.0.0:9090
secret: "123456"
external-controller-cors:
  allow-origins:
    - "*"
  allow-private-network: true

########################################
#              GeoData设置
########################################

geodata-mode: true
geosite-matcher: succinct
geodata-loader: memconservative
geo-auto-update: true
geo-update-interval: 72
geox-url:
  geoip: https://github.com/MetaCubeX/meta-rules-dat/releases/download/latest/geoip.dat
  geosite: https://github.com/MetaCubeX/meta-rules-dat/releases/download/latest/geosite.dat
  mmdb: https://github.com/MetaCubeX/meta-rules-dat/releases/download/latest/country.mmdb

########################################
#              DNS设置
########################################

dns:
  enable: true
  listen: 0.0.0.0:7874
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  ipv6: true
  respect-rules: true
  use-hosts: true
  prefer-h3: false
  cache-algorithm: arc

  nameserver-policy:
    "geosite:cn":
      - https://223.5.5.5/dns-query
      - https://doh.pub/dns-query

  nameserver:
    - https://cloudflare-dns.com/dns-query
    - https://dns.google/dns-query

  fallback:
    - https://cloudflare-dns.com/dns-query
    - https://dns.google/dns-query
    - https://dns.quad9.net/dns-query
    - https://security.cloudflare-dns.com/dns-query

  fake-ip-filter:
    - "*.lan"
    - "*.local"
    - "*.localhost"
    - "+.home.arpa"
    - "msftconnecttest.com"
    - "msftncsi.com"
    - "courier.push.apple.com"
    - "+.apple.com"
    - "+.microsoft.com"
    - "+.steamcontent.com"
    - "localhost.ptlogin2.qq.com"

########################################
#              流量嗅探
########################################

sniffer:
  enable: true
  parse-pure-ip: true
  force-dns-mapping: true
  override-destination: true
  sniff:
    HTTP:
      ports:
        - 80
    TLS:
      ports:
        - 443
    QUIC:
      ports:
        - 443
  skip-domain:
    - "+.lan"
    - "+.local"
    - "+.home.arpa"
    
########################################
#                 TUN设置
########################################

tun:
  enable: true
  stack: mixed
  mtu: 1490
  auto-route: true
  auto-redirect: true
  auto-detect-interface: true
  strict-route: true
  dns-hijack:
    - any:53

########################################
#              Profile缓存
########################################

profile:
  store-selected: true
  store-fake-ip: true

########################################
#              实验功能
########################################

experimental:
  cache-file: /etc/openclash/cache.db

########################################
#              策略组
########################################

default: ⭐ Default
  type: select
  proxies:
    - 🧭 Select
    - 📡 Auto
    - 🟢 Direct
    - 🔴 Reject
    - 🇭🇰 HK
    - 🇹🇼 TW
    - 🇯🇵 JP
    - 🇰🇷 KR
    - 🇸🇬 SG
    - 🇺🇸 US
    - 🌏 Other

proxy-groups:

  # 业务分流组
  - {name: 🤖 AI, <<: *default}
  - {name: 🎬 Media, <<: *default}
  - {name: 🎵 TikTok, <<: *default}
  - {name: 💰 Crypto, <<: *default}
  - {name: 🎮 Game, <<: *default}
  - {name: 🐙 GitHub, <<: *default}
  - {name: ✈️ Telegram, <<: *default}
  - {name: 🌐 Social, <<: *default}
  - {name: 🔍 Google, <<: *default}
  - {name: 🪟 Microsoft, <<: *default}
  - {name: 🍎 Apple, <<: *default}
  - {name: 📡 Check, <<: *default}
  - {name: 🌍 Outside, <<: *default}
  - {name: ❓ Unknown, <<: *default}
  
  # 地区分流组
  - name: 🧭 Select
    type: select
    include-all: true

  - name: 📡 Auto
    type: url-test
    include-all: true
    url: https://www.gstatic.com/generate_204
    interval: 300
    tolerance: 50

  - name: 🇭🇰 HK
    type: url-test
    include-all: true
    url: https://www.gstatic.com/generate_204
    interval: 300
    tolerance: 50
    filter: "(?=.*(广港|香港|HK|Hong Kong|🇭🇰|HongKong)).*$"

  - name: 🇹🇼 TW
    type: url-test
    include-all: true
    url: https://www.gstatic.com/generate_204
    interval: 300
    tolerance: 50
    filter: "(?=.*(台湾|TW|Taiwan|🇹🇼|TaiWan)).*$"

  - name: 🇯🇵 JP
    type: url-test
    include-all: true
    url: https://www.gstatic.com/generate_204
    interval: 300
    tolerance: 50
    filter: "(?=.*(日本|JP|Japan|🇯🇵)).*$"

  - name: 🇰🇷 KR
    type: url-test
    include-all: true
    url: https://www.gstatic.com/generate_204
    interval: 300
    tolerance: 50
    filter: "(?=.*(韩国|KR|Korea|🇰🇷)).*$"

  - name: 🇸🇬 SG
    type: url-test
    include-all: true
    url: https://www.gstatic.com/generate_204
    interval: 300
    tolerance: 50
    filter: "(?=.*(新加坡|SG|Singapore|🇸🇬)).*$"

  - name: 🇺🇸 US
    type: url-test
    include-all: true
    url: https://www.gstatic.com/generate_204
    interval: 300
    tolerance: 50
    filter: "(?=.*(美国|US|USA|United States|🇺🇸)).*$"

  - name: 🌏 Other
    type: url-test
    include-all: true
    url: https://www.gstatic.com/generate_204
    interval: 300
    tolerance: 50
    filter: "(?i)^(?!.*(香港|HK|Hong Kong|台湾|TW|Taiwan|日本|JP|Japan|韩国|KR|Korea|新加坡|SG|Singapore|美国|US|USA)).*$"

########################################
#              分流规则
########################################

rules:
  - RULE-SET,ChatGPT-GeoSite,🤖 AI
  - RULE-SET,Claude-GeoSite,🤖 AI
  - RULE-SET,Meta-GeoSite,🤖 AI
  - RULE-SET,Perplexity-GeoSite,🤖 AI
  - RULE-SET,Copilot-GeoSite,🤖 AI
  - RULE-SET,Gemini-GeoSite,🤖 AI
  - RULE-SET,Youtube-GeoSite,🎬 Media
  - RULE-SET,Netflix-GeoSite,🎬 Media
  - RULE-SET,Netflix-GeoIP,🎬 Media
  - RULE-SET,Disney-GeoSite,🎬 Media
  - RULE-SET,Spotify-GeoSite,🎬 Media
  - RULE-SET,Amazon-GeoSite,🎬 Media
  - RULE-SET,HBO-GeoSite,🎬 Media
  - RULE-SET,TikTok-GeoSite,🎵 TikTok
  - RULE-SET,TikTok-GeoSite,💰 Crypto
  
########################################
#              规则合集
########################################
rule-anchor:
  ip: &ip {type: http, interval: 86400, behavior: ipcidr, format: mrs}
  domain: &domain {type: http, interval: 86400, behavior: domain, format: mrs}
  class: &class {type: http, interval: 86400, behavior: classical, format: text}

rule-providers:
  ChatGPT-GeoSite: {<<: *domain, url: "https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/refs/heads/meta/geo/geosite/openai.mrs"}
  Claude-GeoSite: {<<: *domain, url: "https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/refs/heads/meta/geo/geosite/anthropic.mrs"}
  Meta-GeoSite: {<<: *domain, url: "https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/refs/heads/meta/geo/geosite/meta.mrs"}
  Perplexity-GeoSite: {<<: *domain, url: "https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/refs/heads/meta/geo/geosite/perplexity.mrs"}
  Copilot-GeoSite: {<<: *domain, url: "https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/refs/heads/meta/geo/geosite/github-copilot.mrs"}
  Gemini-GeoSite: {<<: *domain, url: "https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/refs/heads/meta/geo/geosite/google-gemini.mrs"}
  Youtube-GeoSite: {<<: *domain, url: "https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/refs/heads/meta/geo/geosite/youtube.mrs"}
  Netflix-GeoSite: {<<: *domain, url: "https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/refs/heads/meta/geo/geosite/netflix.mrs"}
  Netflix-GeoIP: {<<: *ip, url: "https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/refs/heads/meta/geo/geoip/netflix.mrs"}
  Disney-GeoSite: {<<: *domain, url: "https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/refs/heads/meta/geo/geosite/disney.mrs"}
  Spotify-GeoSite: {<<: *domain, url: "https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/refs/heads/meta/geo/geosite/spotify.mrs"}
  Amazon-GeoSite: {<<: *domain, url: "https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/refs/heads/meta/geo/geosite/amazon.mrs"}
  HBO-GeoSite: {<<: *domain, url: "https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/refs/heads/meta/geo/geosite/hbo.mrs"}
