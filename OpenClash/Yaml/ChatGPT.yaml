########################################
#              基础设置
########################################

mixed-port: 7890
allow-lan: true
bind-address: "*"
mode: rule
log-level: info
ipv6: true
unified-delay: true
tcp-concurrent: true
find-process-mode: strict
global-client-fingerprint: chrome
keep-alive-idle: 600
keep-alive-interval: 15
external-controller: 0.0.0.0:9090
secret: "123456"
external-controller-cors:
  allow-origins:
    - "*"
  allow-private-network: true

########################################
#              GeoData设置
########################################

geodata-mode: true
geosite-matcher: succinct
geodata-loader: memconservative
geo-auto-update: true
geo-update-interval: 72
geox-url:
  geoip: https://github.com/MetaCubeX/meta-rules-dat/releases/download/latest/geoip.dat
  geosite: https://github.com/MetaCubeX/meta-rules-dat/releases/download/latest/geosite.dat
  mmdb: https://github.com/MetaCubeX/meta-rules-dat/releases/download/latest/country.mmdb

########################################
#              DNS设置
########################################

dns:
  enable: true
  listen: 0.0.0.0:7874
  ipv6: true
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  respect-rules: true
  use-hosts: true

  proxy-server-nameserver:
    - https://223.5.5.5/dns-query
    - https://doh.pub/dns-query

  nameserver-policy:
    "geosite:cn":
      - https://223.5.5.5/dns-query
      - https://doh.pub/dns-query

  nameserver:
    - https://223.5.5.5/dns-query
    - https://doh.pub/dns-query

  fallback:
    - https://cloudflare-dns.com/dns-query
    - https://security.cloudflare-dns.com/dns-query
    - https://dns.google/dns-query

  fallback-filter:
    geoip: true
    geoip-code: CN
    geosite:
      - gfw

fake-ip-filter:
  - "*.lan"
  - "*.local"
  - "*.localhost"
  - "+.home.arpa"
  - "msftconnecttest.com"
  - "msftncsi.com"
  - "+.apple.com"
  - "courier.push.apple.com"
  - "+.microsoft.com"
  - "+.steamcontent.com"
  - "+.steamusercontent.com"

########################################
#              流量嗅探
########################################

sniffer:
  enable: true
  parse-pure-ip: true
  force-dns-mapping: true
  override-destination: true
  sniff:
    HTTP:
      ports:
        - 80
    TLS:
      ports:
        - 443
    QUIC:
      ports:
        - 443
  skip-domain:
    - "+.lan"
    - "+.local"
    - "+.home.arpa"
    
########################################
#                 TUN设置
########################################

tun:
  enable: true
  stack: gvisor
  mtu: 1490
  auto-route: true
  auto-redirect: true
  auto-detect-interface: true
  strict-route: true
  dns-hijack:
    - any:53

########################################
#              Profile缓存
########################################

profile:
  store-selected: true
  store-fake-ip: true

########################################
#              实验功能
########################################

experimental:
  cache-file: /etc/openclash/cache.db

########################################
#              策略组
########################################

default: &default
  type: select
  proxies:
    - 🧭 Select
    - 📡 Auto
    - 🇭🇰 HK
    - 🇹🇼 TW
    - 🇯🇵 JP
    - 🇰🇷 KR
    - 🇸🇬 SG
    - 🇺🇸 US
    - 🌏 Other

direct: &direct
  type: select
  proxies:
    - 🟢 Direct

reject: &reject
  type: select
  proxies:
    - 🔴 Reject

proxy-groups:

  # 业务分流组
  - {name: 🤖 AI, <<: *default}
  - {name: 🎬 Media, <<: *default}
  - {name: 🎵 TikTok, <<: *default}
  - {name: 💰 Crypto, <<: *default}
  - {name: 🎮 Game, <<: *default}
  - {name: 🐙 GitHub, <<: *default}
  - {name: ✈️ Telegram, <<: *default}
  - {name: 🌐 Social, <<: *default}
  - {name: 🔍 Google, <<: *default}
  - {name: 🪟 Microsoft, <<: *default}
  - {name: 🍎 Apple, <<: *default}
  - {name: 📡 Check, <<: *default}
  - {name: 🚫 Block, <<: *reject}
  - {name: 🏠 Inside, <<: *direct}
  - {name: 🌍 Outside, <<: *default}
  - {name: 🧐  Unknown, <<: *default}
  
  # 地区分流组
  - name: 🧭 Select
    type: select
    include-all: true
    exclude-type: direct

  - name: 📡 Auto
    type: url-test
    include-all: true
    exclude-type: direct
    exclude-filter: "流量|剩余|官网|过期|到期|Expire|Traffic|Reset|重置"
    url: https://www.gstatic.com/generate_204
    interval: 300
    tolerance: 50
    lazy: true

  - name: 🇭🇰 HK
    type: url-test
    include-all: true
    url: https://www.gstatic.com/generate_204
    interval: 300
    tolerance: 50
    filter: "(?=.*(广港|香港|HK|Hong Kong|🇭🇰|HongKong)).*$"

  - name: 🇹🇼 TW
    type: url-test
    include-all: true
    url: https://www.gstatic.com/generate_204
    interval: 300
    tolerance: 50
    filter: "(?=.*(台湾|TW|Taiwan|🇹🇼|TaiWan)).*$"

  - name: 🇯🇵 JP
    type: url-test
    include-all: true
    url: https://www.gstatic.com/generate_204
    interval: 300
    tolerance: 50
    filter: "(?=.*(日本|JP|Japan|🇯🇵)).*$"

  - name: 🇰🇷 KR
    type: url-test
    include-all: true
    url: https://www.gstatic.com/generate_204
    interval: 300
    tolerance: 50
    filter: "(?=.*(韩国|KR|Korea|🇰🇷)).*$"

  - name: 🇸🇬 SG
    type: url-test
    include-all: true
    url: https://www.gstatic.com/generate_204
    interval: 300
    tolerance: 50
    filter: "(?=.*(新加坡|SG|Singapore|🇸🇬)).*$"

  - name: 🇺🇸 US
    type: url-test
    include-all: true
    url: https://www.gstatic.com/generate_204
    interval: 300
    tolerance: 50
    filter: "(?=.*(美国|US|USA|United States|🇺🇸)).*$"

  - name: 🌏 Other
    type: url-test
    include-all: true
    url: https://www.gstatic.com/generate_204
    interval: 300
    tolerance: 50
    filter: "(?i)^(?!.*(香港|HK|Hong Kong|台湾|TW|Taiwan|日本|JP|Japan|韩国|KR|Korea|新加坡|SG|Singapore|美国|US|USA)).*$"

########################################
#              分流规则
########################################

rules:
  - RULE-SET,PrivateProxy-Class,🌍 Outside
  - RULE-SET,PrivateDirect-Class,🏠 Inside
  - RULE-SET,ChatGPT-GeoSite,🤖 AI
  - RULE-SET,Claude-GeoSite,🤖 AI
