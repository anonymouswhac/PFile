  - RULE-SET,Telegram-GeoSite,✈️ Telegram
  - RULE-SET,Telegram-GeoIP,✈️ Telegram
  - RULE-SET,WhatsApp-GeoSite,🌐 Social
  - RULE-SET,Twitter-GeoSite,🌐 Social
  - RULE-SET,Instagram-GeoSite,🌐 Social
  - RULE-SET,Discord-GeoSite,🌐 Social
  - RULE-SET,Google-GeoSite,🔍 Google
  - RULE-SET,Google-GeoIP,🔍 Google
  - RULE-SET,Microsoft-GeoSite,🪟 Microsoft
  - RULE-SET,Apple-GeoSite,🍎 Apple
  - RULE-SET,Check-Class,📡 Check
  - RULE-SET,AD-GeoSite,🚫 Block
  - RULE-SET,Block-Class,🚫 Block
  - RULE-SET,Proxy-Class,🌍 Outside
  - RULE-SET,Globe-Class,🌍 Outside
  - RULE-SET,Direct-Class,🏠 Inside
  - RULE-SET,China-GeoSite,🏠 Inside
  - RULE-SET,China-GeoIP,🏠 Inside,no-resolve
  - RULE-SET,Private-GeoSite,🏠 Inside
  - MATCH,🧐  Unknown
  
